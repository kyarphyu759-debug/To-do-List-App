<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Notes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:20px;
    box-shadow:0 8px 32px rgba(0,0,0,.2);
}

textarea{
    width:100%;
    height:130px;
    border:none;
    outline:none;
    resize:none;
    border-radius:15px;
    padding:15px;
    font-size:16px;
}

.save-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#00c6ff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.save-btn:hover{
    transform:scale(1.02);
}

.notes-title{
    color:white;
    margin:20px 0;
}

.note{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    animation:fade .3s ease;
}

.note-text{
    white-space:pre-wrap;
    line-height:1.6;
}

.note-date{
    margin-top:10px;
    color:gray;
    font-size:12px;
}

.actions{
    margin-top:15px;
}

.edit-btn{
    background:#f39c12;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
}

.delete-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
    margin-left:5px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    width:320px;
    padding:20px;
    border-radius:15px;
    text-align:center;
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-buttons{
    margin-top:15px;
}

.confirm-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

.cancel-btn{
    background:#3498db;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-left:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>📝 My Notes</h1>

<div class="card">

<textarea
id="noteInput"
placeholder="Write your note here..."></textarea>

<button
class="save-btn"
onclick="saveNote()">
💾 Save Note
</button>

</div>

<h2 class="notes-title">Saved Notes</h2>

<div id="notesContainer"></div>

</div>

<!-- Delete Modal -->

<div id="deleteModal" class="modal">

<div class="modal-content">

<h3>🗑 Delete Note</h3>

<p>
ဒီ Note ကို ဖျက်မှာ သေချာပါသလား?
</p>

<div class="modal-buttons">

<button
class="confirm-btn"
onclick="confirmDelete()">
Delete
</button>

<button
class="cancel-btn"
onclick="closeModal()">
Cancel
</button>

</div>

</div>

</div>

<script>

let editIndex = -1;
let deleteIndex = -1;

loadNotes();

function saveNote(){

let text =
document.getElementById("noteInput")
.value.trim();

if(text===""){
alert("Please write a note.");
return;
}

let notes =
JSON.parse(localStorage.getItem("notes"))
|| [];

let date =
new Date().toLocaleString();

if(editIndex === -1){

notes.unshift({
text:text,
date:"📅 "+date
});

}else{

notes[editIndex] = {
text:text,
date:"✏ Edited : "+date
};

editIndex = -1;

}

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

document.getElementById("noteInput")
.value="";

loadNotes();

}

function loadNotes(){

let notes =
JSON.parse(localStorage.getItem("notes"))
|| [];

let container =
document.getElementById("notesContainer");

container.innerHTML = "";

notes.forEach((note,index)=>{

container.innerHTML += `

<div class="note">

<div class="note-text">
${note.text}
</div>

<div class="note-date">
${note.date}
</div>

<div class="actions">

<button
class="edit-btn"
onclick="editNote(${index})">
✏ Edit
</button>

<button
class="delete-btn"
onclick="deleteNote(${index})">
🗑 Delete
</button>

</div>

</div>

`;

});

}

function editNote(index){

let notes =
JSON.parse(localStorage.getItem("notes"))
|| [];

document.getElementById("noteInput")
.value = notes[index].text;

editIndex = index;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function deleteNote(index){

deleteIndex = index;

document.getElementById("deleteModal")
.style.display = "flex";

}

function closeModal(){

document.getElementById("deleteModal")
.style.display = "none";

}

function confirmDelete(){

let notes =
JSON.parse(localStorage.getItem("notes"))
|| [];

notes.splice(deleteIndex,1);

localStorage.setItem(
"notes",
JSON.stringify(notes)
);

closeModal();
loadNotes();

}

</script>

</body>
</html>
