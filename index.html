<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #697586;
      --panel: #ffffff;
      --surface: #f5f7fb;
      --line: #d8dee9;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --complete: #138a72;
      --danger: #c2410c;
      --shadow: 0 18px 42px rgba(35, 44, 64, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(19, 138, 114, 0.10)), var(--surface);
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .app-body {
      padding: 24px 28px 28px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input[type="text"] {
      min-width: 0;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 14px;
      font: inherit;
      color: var(--ink);
      background: #ffffff;
    }

    input[type="text"]:focus {
      outline: 3px solid rgba(37, 99, 235, 0.2);
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .add-button {
      min-height: 48px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      background: var(--accent);
      font-weight: 700;
    }

    .add-button:hover {
      background: var(--accent-dark);
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .stats span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fbfcff;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: #fbfcff;
    }

    .task {
      display: grid;
      grid-template-columns: 36px 1fr 40px;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #ffffff;
    }

    .task.completed {
      background: #f2fbf8;
      border-color: rgba(19, 138, 114, 0.32);
    }

    .check {
      width: 24px;
      height: 24px;
      justify-self: center;
      accent-color: var(--complete);
      cursor: pointer;
    }

    .task-text {
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      line-height: 1.45;
      padding: 6px 2px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .task.completed .task-text {
      color: var(--muted);
      text-decoration: line-through;
      opacity: 0.72;
    }

    .delete-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--danger);
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .delete-button:hover {
      background: #ffedd5;
      border-color: #fdba74;
    }

    .delete-button svg,
    .add-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
        place-items: start center;
      }

      header,
      .app-body {
        padding-left: 18px;
        padding-right: 18px;
      }

      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>To-Do List</h1>
      <p class="summary">Add tasks, mark them complete, delete what you do not need, and keep everything saved in this browser.</p>
    </header>

    <section class="app-body" aria-label="To-do list app">
      <form id="task-form">
        <label for="task-input">New task</label>
        <input id="task-input" type="text" placeholder="Write code for 2 hours" autocomplete="off" required>
        <button class="add-button" type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          Add
        </button>
      </form>

      <div class="stats" aria-live="polite">
        <span id="total-count">0 tasks</span>
        <span id="completed-count">0 completed</span>
      </div>

      <ul id="task-list" aria-label="Tasks"></ul>
      <p id="empty-state" class="empty">No tasks yet.</p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "codex-todo-list-tasks";
    const form = document.querySelector("#task-form");
    const input = document.querySelector("#task-input");
    const taskList = document.querySelector("#task-list");
    const emptyState = document.querySelector("#empty-state");
    const totalCount = document.querySelector("#total-count");
    const completedCount = document.querySelector("#completed-count");

    let tasks = loadTasks();

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function createTask(text) {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        text,
        completed: false
      };
    }

    function addTask(text) {
      const trimmedText = text.trim();

      if (!trimmedText) {
        return;
      }

      tasks.unshift(createTask(trimmedText));
      saveTasks();
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map((task) => (
        task.id === id ? { ...task, completed: !task.completed } : task
      ));
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter((task) => task.id !== id);
      saveTasks();
      renderTasks();
    }

    function renderTasks() {
      taskList.innerHTML = "";

      tasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = `task${task.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.className = "check";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark ${task.text} as ${task.completed ? "incomplete" : "complete"}`);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const textButton = document.createElement("button");
        textButton.className = "task-text";
        textButton.type = "button";
        textButton.textContent = task.text;
        textButton.addEventListener("click", () => toggleTask(task.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
        deleteButton.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4h6l1 2h4M4 6h16M7 6l1 16h8l1-16M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        item.append(checkbox, textButton, deleteButton);
        taskList.append(item);
      });

      const completed = tasks.filter((task) => task.completed).length;
      emptyState.hidden = tasks.length > 0;
      totalCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
      completedCount.textContent = `${completed} completed`;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      addTask(input.value);
      input.value = "";
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
