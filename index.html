<!DOCTYPE html>          
<html lang="en">          
<head>          
<meta charset="UTF-8">          
<meta name="viewport" content="width=device-width, initial-scale=1.0">          
<title>Notes App with Trash + Dark + Edit</title>          
          
<style>          
*{          
    margin:0;          
    padding:0;          
    box-sizing:border-box;          
    font-family:Segoe UI;          
}          
          
body{          
    min-height:100vh;          
    background:linear-gradient(135deg,#667eea,#764ba2);          
    padding:20px;          
}          
          
body.dark{background:#0f172a;}          
          
.screen{display:none;}          
.active{display:block;}          
          
.container{max-width:800px;margin:auto;}          
          
.top-bar{          
    display:flex;          
    justify-content:flex-end;          
    gap:10px;          
    margin-bottom:10px;          
}          
          
.counter{          
    margin-right:auto;          
    background:rgba(255,255,255,.25);          
    color:white;          
    padding:8px 12px;          
    border-radius:20px;          
}          
          
.icon-btn{          
    width:42px;height:42px;          
    border-radius:50%;          
    border:none;          
    background:rgba(255,255,255,.2);          
    color:white;          
    font-size:18px;          
    cursor:pointer;          
}          
          
.card{          
    background:rgba(255,255,255,.15);          
    padding:20px;          
    border-radius:20px;          
}          
          
textarea{          
    width:100%;          
    height:120px;          
    border:none;          
    outline:none;          
    border-radius:10px;          
    padding:10px;          
}          
          
#colorPicker{          
    width:100%;          
    height:40px;          
    margin-top:10px;          
}          
          
#imageInput{          
    width:100%;          
    margin-top:10px;          
    color:white;          
}          
          
.save-btn{          
    width:100%;          
    margin-top:10px;          
    padding:10px;          
    border:none;          
    border-radius:10px;          
    background:#00c6ff;          
    color:white;          
}          
          
.note{          
    margin-top:15px;          
    padding:15px;          
    border-radius:15px;          
}          
          
.note img{          
    width: 100%;          
    height: 220px;          
    object-fit: cover;          
    border-radius: 10px;          
    margin-top:10px;          
}          
          
.note-text{white-space:pre-wrap;}          
.note-date{font-size:12px;margin-top:5px;}          
          
.actions button{          
    margin-right:5px;          
    margin-top:10px;          
    padding:6px 10px;          
    border:none;          
    border-radius:6px;          
}          
          
.edit-btn{background:#f39c12;color:white;}          
.delete-btn{background:#e74c3c;color:white;}          
.pin-btn{background:#9b59b6;color:white;}          
.restore-btn{background:#2ecc71;color:white;}          
.perm-btn{background:#e74c3c;color:white;}          
          
.empty{          
    text-align:center;          
    color:white;          
    margin-top:50px;          
}          
</style>          
</head>          
          
<body>          
          
<div class="container">          
          
<!-- HOME -->          
<div id="homeScreen" class="screen active">          
          
<div class="top-bar">          
<div class="counter" id="noteCounter">Notes: 0</div>          
<button class="icon-btn" onclick="openForm()">➕</button>          
<button class="icon-btn" onclick="openTrash()">🗑</button>          
<button class="icon-btn" onclick="toggleDark()">🌙</button>          
</div>          
          
<div id="notesContainer"></div>          
</div>          
          
<!-- WRITE -->          
<div id="writeScreen" class="screen">          
<div class="card">          
          
<textarea id="noteInput"></textarea>          
<input type="color" id="colorPicker">          
<input type="file" id="imageInput" accept="image/*">          
          
<button class="save-btn" onclick="saveNote()">Save</button>          
<button class="save-btn" style="background:#3498db" onclick="goHome()">Back</button>          
          
</div>          
</div>          
          
<!-- TRASH -->          
<div id="trashScreen" class="screen">          
<div class="top-bar">          
<div class="counter">Trash Bin</div>          
<button class="icon-btn" onclick="goHome()">🏠</button>          
</div>          
<div id="trashContainer"></div>          
</div>          
          
</div>          
          
<script>          
          
let editIndex = -1;          
const NOTES_KEY = "notes";          
const TRASH_KEY = "trash";          

/* ⭐ AUTO LOAD FIX (IMPORTANT) */
window.addEventListener("DOMContentLoaded", () => {
    loadNotes();
});          
          
function showScreen(id){          
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));          
document.getElementById(id).classList.add("active");          
}          
          
function openForm(){ showScreen("writeScreen"); }          
          
function goHome(){          
showScreen("homeScreen");          
document.getElementById("noteInput").value="";          
document.getElementById("imageInput").value="";          
editIndex=-1;          
loadNotes();          
}          
          
function openTrash(){ showScreen("trashScreen"); loadTrash(); }          
          
/* SAVE */          
function saveNote(){          
let text=document.getElementById("noteInput").value.trim();          
let color=document.getElementById("colorPicker").value;          
let file=document.getElementById("imageInput").files[0];          
          
if(!text && !file) return alert("Write note or add image!");          
          
let notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[];          
let date=new Date().toLocaleString();          
          
function save(img){          
notes.unshift({text,color,date,img,pinned:false});          
localStorage.setItem(NOTES_KEY,JSON.stringify(notes));          
goHome();          
}          
          
if(file){          
let reader=new FileReader();          
reader.onload=function(e){          
save(e.target.result);          
};          
reader.readAsDataURL(file);          
}else{          
save(null);          
}          
}          
          
/* LOAD */          
function loadNotes(){          
let notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[];          
          
notes = notes.map((n,i)=>({...n,i}))          
.sort((a,b)=>(b.pinned||false)-(a.pinned||false));          
          
let box=document.getElementById("notesContainer");          
          
if(notes.length===0){          
box.innerHTML=`<div class="empty">No Notes Yet</div>`;          
document.getElementById("noteCounter").innerText="Notes: 0";          
return;          
}          
          
box.innerHTML="";          
          
notes.forEach(n=>{          
box.innerHTML+=`          
<div class="note" style="background:${n.color};color:${getTextColor(n.color)}">          
          
<div class="note-text">${n.text || ""}</div>          
${n.img ? `<img src="${n.img}">` : ""}          
<div class="note-date">${n.date}</div>          
          
<div class="actions">          
<button class="edit-btn" onclick="editNote(${n.i})">Edit</button>          
<button class="delete-btn" onclick="moveToTrash(${n.i})">Delete</button>          
<button class="pin-btn" onclick="togglePin(${n.i})">${n.pinned?"Unpin":"Pin"}</button>          
</div>          
          
</div>`;          
});          
          
document.getElementById("noteCounter").innerText="Notes: "+notes.length;          
}          
          
function togglePin(i){          
let notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[];          
notes[i].pinned=!notes[i].pinned;          
localStorage.setItem(NOTES_KEY,JSON.stringify(notes));          
loadNotes();          
}          
          
/* TRASH */          
function moveToTrash(i){          
let notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[];          
let trash=JSON.parse(localStorage.getItem(TRASH_KEY))||[];          
trash.unshift(notes[i]);          
notes.splice(i,1);          
localStorage.setItem(NOTES_KEY,JSON.stringify(notes));          
localStorage.setItem(TRASH_KEY,JSON.stringify(trash));          
loadNotes();          
}          
          
function loadTrash(){          
let trash=JSON.parse(localStorage.getItem(TRASH_KEY))||[];          
let box=document.getElementById("trashContainer");          
          
if(trash.length===0){          
box.innerHTML=`<div class="empty">Trash Empty</div>`;          
return;          
}          
          
box.innerHTML="";          
trash.forEach((n,i)=>{          
box.innerHTML+=`          
<div class="note" style="background:${n.color};color:${getTextColor(n.color)}">          
<div class="note-text">${n.text||""}</div>          
${n.img ? `<img src="${n.img}">` : ""}          
<div class="note-date">${n.date}</div>          
<div class="actions">          
<button class="restore-btn" onclick="restoreNote(${i})">Restore</button>          
<button class="perm-btn" onclick="deleteForever(${i})">Delete Forever</button>          
</div>          
</div>`;          
});          
}          
          
function restoreNote(i){          
let notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[];          
let trash=JSON.parse(localStorage.getItem(TRASH_KEY))||[];          
notes.unshift(trash[i]);          
trash.splice(i,1);          
localStorage.setItem(NOTES_KEY,JSON.stringify(notes));          
localStorage.setItem(TRASH_KEY,JSON.stringify(trash));          
loadTrash();          
}          
          
function deleteForever(i){          
let trash=JSON.parse(localStorage.getItem(TRASH_KEY))||[];          
trash.splice(i,1);          
localStorage.setItem(TRASH_KEY,JSON.stringify(trash));          
loadTrash();          
}          
          
function editNote(i){          
let notes=JSON.parse(localStorage.getItem(NOTES_KEY))||[];          
document.getElementById("noteInput").value=notes[i].text;          
document.getElementById("colorPicker").value=notes[i].color;          
editIndex=i;          
openForm();          
}          
          
function toggleDark(){          
document.body.classList.toggle("dark");          
}          
          
function getTextColor(bg){          
let c=bg.substring(1);          
let r=parseInt(c.substr(0,2),16);          
let g=parseInt(c.substr(2,2),16);          
let b=parseInt(c.substr(4,2),16);          
let bright=(r*299+g*587+b*114)/1000;          
return bright>150?"#000":"#fff";          
}          
          
</script>          
</body>          
</html>
